<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生活费记账本</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --accent: #f59e0b;
      --danger: #ef4444;
      --border: #e5e7eb;
      --shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 42%, #fff7ed 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .app {
      max-width: 1080px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--primary), #7c3aed);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 28px;
      font-weight: 800;
      box-shadow: 0 10px 22px rgba(79, 70, 229, 0.3);
    }

    h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 0.5px;
    }

    header p {
      margin: 4px 0 0;
      font-size: 14px;
      color: var(--muted);
    }

    .month-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .month-nav button {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 10px;
      background: #f3f4f6;
      color: var(--text);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      transition: 0.2s;
    }

    .month-nav button:hover {
      background: #e5e7eb;
    }

    .month-nav input {
      width: 150px;
      border: none;
      outline: none;
      background: transparent;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      padding: 6px 8px;
    }

    .summary {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      border-radius: 22px;
      padding: 22px 24px;
      box-shadow: 0 18px 40px rgba(79, 70, 229, 0.28);
      margin-bottom: 20px;
    }

    .summary::after {
      content: "";
      position: absolute;
      right: -60px;
      top: -70px;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
    }

    .summary-head {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .summary h2 {
      margin: 0;
      font-size: 18px;
    }

    .summary-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-top: 18px;
    }

    .stat {
      padding: 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(6px);
    }

    .stat span {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      opacity: 0.86;
    }

    .stat strong {
      font-size: 22px;
      font-weight: 800;
    }

    .stat.highlight {
      background: rgba(255, 255, 255, 0.96);
      color: var(--primary);
      border-color: transparent;
    }

    .hint {
      position: relative;
      z-index: 1;
      margin: 14px 0 0;
      font-size: 13px;
      opacity: 0.86;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .card-head h2 {
      margin: 0;
      font-size: 18px;
    }

    .tag {
      flex-shrink: 0;
      font-size: 12px;
      color: var(--primary);
      background: #eef2ff;
      padding: 5px 10px;
      border-radius: 999px;
      font-weight: 600;
    }

    .form {
      display: grid;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 18px;
      border-bottom: 1px dashed var(--border);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      background: #fff;
      color: var(--text);
      transition: 0.2s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 2px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
    }

    button[type="submit"] {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 6px 14px rgba(79, 70, 229, 0.25);
    }

    button[type="submit"]:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .ghost {
      background: #f3f4f6;
      color: #374151;
    }

    .ghost:hover {
      background: #e5e7eb;
    }

    .summary .ghost {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .summary .ghost:hover {
      background: rgba(255, 255, 255, 0.26);
    }

    .hidden {
      display: none !important;
    }

    .list {
      display: grid;
      gap: 10px;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .day-group {
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .day-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: #f9fafb;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }

    .day-head strong {
      color: var(--text);
      font-size: 14px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-top: 1px solid #f3f4f6;
    }

    .item-main {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .item-title {
      font-size: 14px;
      font-weight: 700;
      word-break: break-all;
    }

    .item-sub {
      font-size: 12px;
      color: var(--muted);
    }

    .item-right {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .item-right strong {
      font-size: 14px;
    }

    .mini {
      padding: 5px 9px;
      border-radius: 8px;
      background: #f3f4f6;
      color: #4b5563;
      font-size: 12px;
      font-weight: 700;
    }

    .mini:hover {
      background: #e5e7eb;
    }

    .mini.danger {
      background: #fef2f2;
      color: #dc2626;
    }

    .mini.danger:hover {
      background: #fee2e2;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 12px;
      border: 1px dashed var(--border);
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.8;
    }

    footer {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .danger-ghost {
      background: #fef2f2;
      color: #b91c1c;
    }

    .danger-ghost:hover {
      background: #fee2e2;
    }

    footer p {
      flex: 1 1 100%;
      margin: 0;
      padding-top: 8px;
      text-align: center;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translate(-50%, 20px);
      background: #111827;
      color: #fff;
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: 0.25s;
      z-index: 999;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 820px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .summary-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 14px;
      }
      header {
        align-items: flex-start;
      }
      .month-nav {
        width: 100%;
        justify-content: space-between;
      }
      .summary-grid {
        grid-template-columns: 1fr 1fr;
      }
      .stat strong {
        font-size: 19px;
      }
      .row {
        grid-template-columns: 1fr;
      }
      footer {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo">¥</div>
        <div>
          <h1>生活费记账本</h1>
          <p>餐费按天记 · 其他按月记 · 月底一键汇总</p>
        </div>
      </div>
      <div class="month-nav">
        <button id="prevMonth" type="button" aria-label="上个月">‹</button>
        <input type="month" id="monthPicker" aria-label="选择月份">
        <button id="nextMonth" type="button" aria-label="下个月">›</button>
      </div>
    </header>

    <section class="summary">
      <div class="summary-head">
        <h2>月底结算</h2>
        <button id="copySummary" class="ghost" type="button">复制结算文本</button>
      </div>
      <div class="summary-grid">
        <div class="stat">
          <span>餐费合计</span>
          <strong id="mealTotal">¥0.00</strong>
        </div>
        <div class="stat">
          <span>其他合计</span>
          <strong id="otherTotal">¥0.00</strong>
        </div>
        <div class="stat highlight">
          <span>本月总支出</span>
          <strong id="grandTotal">¥0.00</strong>
        </div>
        <div class="stat">
          <span>已记餐费天数</span>
          <strong id="mealDays">0 天</strong>
        </div>
      </div>
      <p class="hint" id="summaryHint"></p>
    </section>

    <main class="grid">
      <section class="card">
        <div class="card-head">
          <h2>餐费（按天）</h2>
          <span class="tag">每天可记多笔</span>
        </div>
        <form id="mealForm" class="form">
          <div class="row">
            <label>
              日期
              <input type="date" id="mealDate" required>
            </label>
            <label>
              金额（元）
              <input type="number" id="mealAmount" step="0.01" min="0.01" placeholder="例如 15.50" required>
            </label>
          </div>
          <label>
            备注（可选）
            <input type="text" id="mealNote" placeholder="例如 早餐 / 食堂午餐">
          </label>
          <div class="actions">
            <button type="submit" id="mealSubmit">添加餐费</button>
            <button type="button" class="ghost hidden" id="mealCancel">取消修改</button>
          </div>
        </form>
        <div id="mealList" class="list"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>其他（按月）</h2>
          <span class="tag">按月记录，月底汇总</span>
        </div>
        <form id="otherForm" class="form">
          <label>
            项目
            <input type="text" id="otherName" placeholder="例如 日用品 / 话费 / 交通" required>
          </label>
          <label>
            金额（元）
            <input type="number" id="otherAmount" step="0.01" min="0.01" placeholder="例如 50" required>
          </label>
          <div class="actions">
            <button type="submit" id="otherSubmit">添加其他支出</button>
            <button type="button" class="ghost hidden" id="otherCancel">取消修改</button>
          </div>
        </form>
        <div id="otherList" class="list"></div>
      </section>
    </main>

    <footer>
      <button id="exportBtn" class="ghost" type="button">导出本月 CSV</button>
      <button id="clearBtn" class="danger-ghost" type="button">清空本月数据</button>
      <p>数据保存在本机浏览器中，不会上传。换设备或清理浏览器数据前，请先导出 CSV 备份。</p>
    </footer>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const STORAGE_KEY = 'lifeExpenseTracker.v1';
    const $ = (id) => document.getElementById(id);

    const els = {
      monthPicker: $('monthPicker'),
      prevMonth: $('prevMonth'),
      nextMonth: $('nextMonth'),
      mealTotal: $('mealTotal'),
      otherTotal: $('otherTotal'),
      grandTotal: $('grandTotal'),
      mealDays: $('mealDays'),
      summaryHint: $('summaryHint'),
      copySummary: $('copySummary'),
      mealForm: $('mealForm'),
      mealDate: $('mealDate'),
      mealAmount: $('mealAmount'),
      mealNote: $('mealNote'),
      mealSubmit: $('mealSubmit'),
      mealCancel: $('mealCancel'),
      mealList: $('mealList'),
      otherForm: $('otherForm'),
      otherName: $('otherName'),
      otherAmount: $('otherAmount'),
      otherSubmit: $('otherSubmit'),
      otherCancel: $('otherCancel'),
      otherList: $('otherList'),
      exportBtn: $('exportBtn'),
      clearBtn: $('clearBtn'),
      toast: $('toast')
    };

    let state = loadState();
    let editingMealId = null;
    let editingOtherId = null;
    let toastTimer = null;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { meals: [], others: [] };
        const parsed = JSON.parse(raw);
        const meals = (Array.isArray(parsed.meals) ? parsed.meals : [])
          .filter((m) => m && m.date && Number(m.amount) > 0)
          .map((m) => ({
            id: m.id || uid(),
            month: m.month || String(m.date).slice(0, 7),
            date: m.date,
            amount: Number(m.amount),
            note: m.note || '',
            createdAt: m.createdAt || 0
          }));
        const others = (Array.isArray(parsed.others) ? parsed.others : [])
          .filter((o) => o && o.name && Number(o.amount) > 0)
          .map((o) => ({
            id: o.id || uid(),
            month: o.month || currentMonthStr(),
            name: o.name,
            amount: Number(o.amount),
            createdAt: o.createdAt || 0
          }));
        return { meals, others };
      } catch (e) {
        return { meals: [], others: [] };
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        toast('保存失败，浏览器存储空间可能已满');
      }
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function fmt(value) {
      return '¥' + (Number(value) || 0).toFixed(2);
    }

    function todayStr() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function currentMonthStr() {
      return todayStr().slice(0, 7);
    }

    function getSelectedMonth() {
      return els.monthPicker.value || currentMonthStr();
    }

    function setSelectedMonth(month) {
      els.monthPicker.value = month;
      adjustMealDateToMonth(month);
      resetMealForm();
      resetOtherForm();
      render();
    }

    function adjustMealDateToMonth(month) {
      if (els.mealDate.value.slice(0, 7) !== month) {
        els.mealDate.value = month === currentMonthStr() ? todayStr() : month + '-01';
      }
    }

    function shiftMonth(delta) {
      const parts = getSelectedMonth().split('-');
      const d = new Date(Number(parts[0]), Number(parts[1]) - 1 + delta, 1);
      setSelectedMonth(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[c]);
    }

    function formatDate(dateStr) {
      const parts = String(dateStr).split('-');
      if (parts.length !== 3) return dateStr;
      const week = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      return Number(parts[1]) + '月' + Number(parts[2]) + '日 ' + week[d.getDay()];
    }

    function getMonthData(month) {
      const meals = state.meals.filter((m) => m.month === month);
      const others = state.others.filter((o) => o.month === month);
      const mealTotal = meals.reduce((sum, m) => sum + Number(m.amount), 0);
      const otherTotal = others.reduce((sum, o) => sum + Number(o.amount), 0);
      const days = new Set(meals.map((m) => m.date)).size;
      return {
        meals,
        others,
        mealTotal,
        otherTotal,
        grandTotal: mealTotal + otherTotal,
        days
      };
    }

    function render() {
      const month = getSelectedMonth();
      const data = getMonthData(month);
      renderMeals(data.meals);
      renderOthers(data.others);
      renderSummary(month, data);
    }

    function renderMeals(meals) {
      const sorted = [...meals].sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
      if (!sorted.length) {
        els.mealList.innerHTML = '<div class="empty">本月还没有餐费记录。<br>在上方选择日期和金额，添加第一笔吧。</div>';
        return;
      }
      const grouped = new Map();
      sorted.forEach((m) => {
        if (!grouped.has(m.date)) grouped.set(m.date, []);
        grouped.get(m.date).push(m);
      });
      let html = '';
      for (const [date, items] of grouped) {
        const dayTotal = items.reduce((sum, i) => sum + Number(i.amount), 0);
        html += '<div class="day-group">';
        html += '<div class="day-head"><span>' + escapeHtml(formatDate(date)) + '</span><strong>' + fmt(dayTotal) + '</strong></div>';
        items.forEach((item) => {
          html += '<div class="item">' +
            '<div class="item-main">' +
              '<span class="item-title">' + escapeHtml(item.note || '餐费') + '</span>' +
              '<span class="item-sub">' + escapeHtml(item.date) + '</span>' +
            '</div>' +
            '<div class="item-right">' +
              '<strong>' + fmt(item.amount) + '</strong>' +
              '<button class="mini" type="button" data-action="edit-meal" data-id="' + item.id + '">改</button>' +
              '<button class="mini danger" type="button" data-action="del-meal" data-id="' + item.id + '">删</button>' +
            '</div>' +
          '</div>';
        });
        html += '</div>';
      }
      els.mealList.innerHTML = html;
    }

    function renderOthers(others) {
      const sorted = [...others].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      if (!sorted.length) {
        els.otherList.innerHTML = '<div class="empty">本月还没有其他支出记录。<br>例如话费、日用品、交通等，都可以记在这里。</div>';
        return;
      }
      els.otherList.innerHTML = sorted.map((o) =>
        '<div class="item">' +
          '<div class="item-main">' +
            '<span class="item-title">' + escapeHtml(o.name) + '</span>' +
            '<span class="item-sub">' + escapeHtml(o.month) + ' 月度记录</span>' +
          '</div>' +
          '<div class="item-right">' +
            '<strong>' + fmt(o.amount) + '</strong>' +
            '<button class="mini" type="button" data-action="edit-other" data-id="' + o.id + '">改</button>' +
            '<button class="mini danger" type="button" data-action="del-other" data-id="' + o.id + '">删</button>' +
          '</div>' +
        '</div>'
      ).join('');
    }

    function renderSummary(month, data) {
      els.mealTotal.textContent = fmt(data.mealTotal);
      els.otherTotal.textContent = fmt(data.otherTotal);
      els.grandTotal.textContent = fmt(data.grandTotal);
      els.mealDays.textContent = data.days + ' 天';
      const label = month.replace('-', ' 年 ') + ' 月';
      els.summaryHint.textContent = label + '：餐费来自 ' + data.days + ' 天记录，其他来自 ' + data.others.length + ' 笔月度记录。' + (data.grandTotal ? '月底结算时直接看上方合计即可。' : '本月还没有记录。');
    }

    function resetMealForm() {
      editingMealId = null;
      els.mealForm.reset();
      els.mealDate.value = els.mealDate.value && els.mealDate.value.slice(0, 7) === getSelectedMonth()
        ? els.mealDate.value
        : (getSelectedMonth() === currentMonthStr() ? todayStr() : getSelectedMonth() + '-01');
      els.mealSubmit.textContent = '添加餐费';
      els.mealCancel.classList.add('hidden');
    }

    function resetOtherForm() {
      editingOtherId = null;
      els.otherForm.reset();
      els.otherSubmit.textContent = '添加其他支出';
      els.otherCancel.classList.add('hidden');
    }

    function toast(message) {
      els.toast.textContent = message;
      els.toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2200);
    }

    els.prevMonth.addEventListener('click', () => shiftMonth(-1));
    els.nextMonth.addEventListener('click', () => shiftMonth(1));
    els.monthPicker.addEventListener('change', () => setSelectedMonth(els.monthPicker.value));

    els.mealCancel.addEventListener('click', resetMealForm);
    els.otherCancel.addEventListener('click', resetOtherForm);

    els.mealForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const month = getSelectedMonth();
      const date = els.mealDate.value;
      const amount = Number(els.mealAmount.value);
      const note = els.mealNote.value.trim();
      if (!date || date.slice(0, 7) !== month) {
        toast('请选择属于当前月份的日期');
        return;
      }
      if (!Number.isFinite(amount) || amount <= 0) {
        toast('请输入大于 0 的金额');
        return;
      }
      if (editingMealId) {
        const item = state.meals.find((m) => m.id === editingMealId);
        if (item) {
          item.date = date;
          item.month = month;
          item.amount = amount;
          item.note = note;
        }
        toast('餐费已修改');
      } else {
        state.meals.push({ id: uid(), month, date, amount, note, createdAt: Date.now() });
        toast('餐费已添加');
      }
      saveState();
      resetMealForm();
      render();
    });

    els.otherForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const month = getSelectedMonth();
      const name = els.otherName.value.trim();
      const amount = Number(els.otherAmount.value);
      if (!name) {
        toast('请填写项目名称');
        return;
      }
      if (!Number.isFinite(amount) || amount <= 0) {
        toast('请输入大于 0 的金额');
        return;
      }
      if (editingOtherId) {
        const item = state.others.find((o) => o.id === editingOtherId);
        if (item) {
          item.name = name;
          item.amount = amount;
          item.month = month;
        }
        toast('其他支出已修改');
      } else {
        state.others.push({ id: uid(), month, name, amount, createdAt: Date.now() });
        toast('其他支出已添加');
      }
      saveState();
      resetOtherForm();
      render();
    });

    document.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const action = btn.dataset.action;
      const id = btn.dataset.id;

      if (action === 'edit-meal') {
        const item = state.meals.find((m) => m.id === id);
        if (!item) return;
        if (item.month !== getSelectedMonth()) setSelectedMonth(item.month);
        editingMealId = id;
        els.mealDate.value = item.date;
        els.mealAmount.value = item.amount;
        els.mealNote.value = item.note || '';
        els.mealSubmit.textContent = '保存修改';
        els.mealCancel.classList.remove('hidden');
        els.mealForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
        els.mealAmount.focus();
      }

      if (action === 'del-meal') {
        if (!confirm('确定删除这笔餐费吗？')) return;
        state.meals = state.meals.filter((m) => m.id !== id);
        if (editingMealId === id) resetMealForm();
        saveState();
        render();
        toast('已删除');
      }

      if (action === 'edit-other') {
        const item = state.others.find((o) => o.id === id);
        if (!item) return;
        if (item.month !== getSelectedMonth()) setSelectedMonth(item.month);
        editingOtherId = id;
        els.otherName.value = item.name;
        els.otherAmount.value = item.amount;
        els.otherSubmit.textContent = '保存修改';
        els.otherCancel.classList.remove('hidden');
        els.otherForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
        els.otherAmount.focus();
      }

      if (action === 'del-other') {
        if (!confirm('确定删除这笔其他支出吗？')) return;
        state.others = state.others.filter((o) => o.id !== id);
        if (editingOtherId === id) resetOtherForm();
        saveState();
        render();
        toast('已删除');
      }
    });

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        toast('结算文本已复制');
      } catch (e) {
        toast('复制失败，请手动记录上方金额');
      }
      document.body.removeChild(ta);
    }

    els.copySummary.addEventListener('click', async () => {
      const month = getSelectedMonth();
      const data = getMonthData(month);
      const label = month.replace('-', ' 年 ') + ' 月';
      const text = label + '生活费结算\n' +
        '餐费合计：' + fmt(data.mealTotal) + '\n' +
        '其他合计：' + fmt(data.otherTotal) + '\n' +
        '本月总支出：' + fmt(data.grandTotal) + '\n' +
        '已记餐费天数：' + data.days + ' 天';
      try {
        await navigator.clipboard.writeText(text);
        toast('结算文本已复制');
      } catch (e) {
        fallbackCopy(text);
      }
    });

    els.exportBtn.addEventListener('click', () => {
      const month = getSelectedMonth();
      const data = getMonthData(month);
      if (!data.meals.length && !data.others.length) {
        toast('本月没有可导出的数据');
        return;
      }
      const rows = [['类型', '日期/月份', '项目', '金额（元）']];
      data.meals.forEach((m) => rows.push(['餐费', m.date, m.note || '餐费', Number(m.amount).toFixed(2)]));
      data.others.forEach((o) => rows.push(['其他', o.month, o.name, Number(o.amount).toFixed(2)]));
      const csv = '\uFEFF' + rows.map((row) => row.map((cell) => '"' + String(cell).replace(/"/g, '""') + '"').join(',')).join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '生活费-' + month + '.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast('CSV 已导出');
    });

    els.clearBtn.addEventListener('click', () => {
      const month = getSelectedMonth();
      const label = month.replace('-', ' 年 ') + ' 月';
      if (!confirm('确定清空 ' + label + ' 的全部记录吗？此操作不可恢复。')) return;
      state.meals = state.meals.filter((m) => m.month !== month);
      state.others = state.others.filter((o) => o.month !== month);
      saveState();
      resetMealForm();
      resetOtherForm();
      render();
      toast('本月数据已清空');
    });

    function init() {
      const today = todayStr();
      els.monthPicker.value = today.slice(0, 7);
      els.mealDate.value = today;
      render();
    }

    init();
  </script>
</body>
</html>
